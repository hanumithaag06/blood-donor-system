<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blood Donor Registry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <span class="brand">🩸 Blood Donor Registry</span>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/">Search</a>
            <a href="/register">Register</a>
            <a href="/assistant">Assistant</a>
        </div>
    </nav>

    <main class="container">
        <h1>Find Eligible Donors</h1>

        <form id="search-form" class="filter-form">
            <select id="blood_group">
                <option value="">Any Blood Group</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
            </select>

            <select id="area" class="area-select">
                <option value="">Any Area</option>
            </select>

            <label class="checkbox-label">
                <input type="checkbox" id="eligible_only"> Eligible only
            </label>

            <button type="submit">Search</button>
        </form>

        <div id="results-status" class="status-text"></div>

        <h2>Available Donors</h2>
        <div id="available-donors" class="donor-card-grid"></div>

        <h2>Unavailable Donors</h2>
        <div id="unavailable-donors" class="donor-card-grid"></div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", initSearchPage);
    </script>
</body>
</html>
