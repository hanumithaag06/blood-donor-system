<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donation History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <span class="brand">🩸 Blood Donor Registry</span>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/">Search</a>
            <a href="/register">Register</a>
            <a href="/assistant">Assistant</a>
        </div>
    </nav>
    <main class="container">
        <h1>Donation History</h1>
        <table class="donor-table">
            <thead>
                <tr><th>Date</th><th>Hospital / Location</th><th>Units (ml)</th></tr>
            </thead>
            <tbody id="history-body"></tbody>
        </table>
        <div id="history-status" class="status-text"></div>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        const DONOR_ID = {{ request.path.split('/')[-1] }};
        document.addEventListener("DOMContentLoaded", () => initHistoryPage(DONOR_ID));
    </script>
</body>
</html>
