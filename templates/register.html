<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register — Blood Donor Registry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <span class="brand">🩸 Blood Donor Registry</span>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/">Search</a>
            <a href="/register">Register</a>
            <a href="/assistant">Assistant</a>
        </div>
    </nav>

    <main class="container">
        <h1>Donor Registration</h1>

        <!-- Mode buttons -->
        <div class="mode-tabs" role="tablist">
            <button type="button" id="tab-add" class="tab-btn active"
                    role="tab" aria-selected="true" onclick="switchMode('add')">
                Add New Donor
            </button>
            <button type="button" id="tab-update" class="tab-btn"
                    role="tab" aria-selected="false" onclick="switchMode('update')">
                Update Existing Donor
            </button>
        </div>

        <!-- ---------- MODE 1: Add New Donor (visible by default) ---------- -->
        <section id="mode-add" class="mode-section active">
            <form id="donor-form" class="stacked-form">
                <label>Full Name
                    <input type="text" id="full_name" required>
                </label>
                <label>Date of Birth
                    <input type="date" id="date_of_birth" required onchange="updateAgeDisplay()">
                </label>
                <label>Age (calculated)
                    <input type="text" id="age_display" readonly>
                </label>
                <label>Gender
                    <select id="gender">
                        <option value="">Prefer not to say</option>
                        <option>Male</option><option>Female</option><option>Other</option>
                    </select>
                </label>
                <label>Blood Group
                    <select id="blood_group" required>
                        <option value="">Select</option>
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </label>
                <label>Phone Number
                    <input type="text" id="phone_number" required>
                </label>
                <label>Area
                    <select id="area" class="area-select" required>
                        <option value="">Select Area</option>
                    </select>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="is_available" checked> Currently Available
                </label>
                <div id="form-errors" class="error-text"></div>
                <button type="submit">Register Donor</button>
            </form>
            <div id="donor-status" class="status-text"></div>
        </section>

        <!-- ---------- MODE 2: Update Existing Donor (hidden by default) ---------- -->
        <section id="mode-update" class="mode-section">
            <form id="lookup-form" class="stacked-form">
                <label>Search by Donor ID
                    <input type="number" id="lookup_donor_id">
                </label>
                <label>or Phone Number
                    <input type="text" id="lookup_phone_number">
                </label>
                <button type="submit">Find Donor</button>
            </form>
            <div id="lookup-status" class="status-text"></div>

            <div id="update-panel" class="update-panel-hidden">
                <h2>Update Donor Profile</h2>
                <form id="update-form" class="stacked-form">
                    <input type="hidden" id="update_donor_id">
                    <p id="update-readonly-info" class="profile-card"></p>
                    <label>Area
                        <select id="update_area" class="area-select"></select>
                    </label>
                    <label>Phone Number
                        <input type="text" id="update_phone_number">
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="update_is_available"> Currently Available
                    </label>
                    <button type="submit">Save Profile Changes</button>
                </form>
                <div id="update-status" class="status-text"></div>

                <h2>Record Donation</h2>
                <form id="record-donation-form" class="stacked-form">
                    <label>Donation Date
                        <input type="date" id="donation_date" required>
                    </label>
                    <label>Volume (ml, optional)
                        <input type="number" id="donation_volume_ml">
                    </label>
                    <button type="submit">Save Donation</button>
                </form>
                <div id="donation-status" class="status-text"></div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>document.addEventListener("DOMContentLoaded", initRegisterPage);</script>
</body>
</html>
